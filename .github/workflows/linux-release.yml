name: Build Linux release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the Linux build to"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  linux:
    # Older Ubuntu keeps the binary compatible with more distros (older glibc).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev \
            libxi-dev libxrandr-dev libgl1-mesa-dev libvulkan-dev libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir dist
          cp target/release/recipe_book dist/recipe_book
          tar -C dist -czf recipe_book-linux-x86_64.tar.gz recipe_book

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" recipe_book-linux-x86_64.tar.gz --clobber
